# Specifiy analysis name
# Valid options: name to identify .yaml config data files
ANALYSIS_NAME: fear

# Specify path to data
# Valid options: path to and name of .xlsx data file
PATH_TO_DATA: ../sample_data/fear_20260709.xlsx

# Specify sheet name
# Valid options: sheet name in .xlsx file 
SHEET_NAME: all_data

# Specify grouping for CV split
# Valid options: column name in sheet of .xlsx
G_NAME: [participant_id]

# Specify predictor name(s)
# Valid options: column name(s) in sheet of .xlsx
X_NAMES: [
    stim_id,
    gender,
    age,
    FSQ_1_sum,
    SPQ_sum,
    SAS_sum,
    STAI_state_sum,
    STAI_trait_sum,
    FEE_sum,
    SEE_sum,
]

# Specify indices for X_NAMES that indicate continuous numeric variables
# Valid options: list of integer starting with 0 or empty list
X_CONTINUOUS_IND: [2, 3, 4, 5, 6, 7, 8, 9]

# Specify indices for X_NAMES that indicate binary discrete variables
# Valid options: list of integer starting with 0 or empty list
X_BINARY_IND: [1]

# Specify indices for X_NAMES that indicate multi categorical variables (TARGET ENCODING or ONE HOT ENCODING)
# Valid options: list of integer starting with 0 or empty list
X_MULTICAT_IND: [0]

# Specify target name(s)
# Valid options: column name(s) in sheet of .xlsx
Y_NAMES: [fear]

# Specify indices for Y_NAMES that indicate continuous numeric variables (REGRESSION)
# Valid options: list of integer starting with 0 or empty list
Y_CONTINUOUS_IND: [0]

# Specify indices for Y_NAMES that indicate binary variables (CLASSIFICATION)
# Valid options: list of integer starting with 0 or empty list
Y_BINARY_IND: []

# Specify indices for Y_NAMES that indicate multiclass categorical variables (CLASSIFICATION)
# Valid options: list of integer starting with 0 or empty list
Y_MULTICLASS_IND: []

# Specify data splitting scheme
# Valid options: str of "RepeatedGroupKFold" or "ExtendedGroupShuffleSplit"
SPLITTER: ExtendedGroupShuffleSplit

# Parameters passed directly to the splitter class instantiation
SPLITTER_PARAMS:
    n_splits: 99
    n_test_groups: 1
    train_groups: [1, 3, 4, 5, 6, 14, 16, 17, 19, 20, 21, 23, 24, 35, 38, 40, 41, 44, 45, 49, 53, 55, 56, 58, 60, 61, 65, 66, 67, 68, 77, 78, 82, 83, 84, 85, 89, 94, 95, 101, 103, 106, 107, 110, 111, 124, 130, 132, 133, 134, 135, 136, 137, 141, 142, 143, 144, 145, 149, 153, 155, 157, 158, 160, 161, 162, 163, 169, 172, 173, 180, 182, 184, 186, 188, 190, 195, 198, 200, 201, 202, 206, 207, 210, 211, 212, 213, 216, 217, 218, 224, 226, 227, 229, 232, 233, 234, 235, 239]
    max_test_samples_per_group: 45
    n_inject_samples: 10
    injection_strategy: lowest_target
    feature_group_col: 0
    replace: False
    max_combinations_exhaustive: 10000
    random_state: 3141592

# Define the list of active pipeline configurations to execute sequentially.
# Each entry contains a label name and its respective pipeline instantiator function.
PIPELINE_CONFIGS: ["linear", "gb", "tabicl"]